# Publishes @latere-ai/luxsdk to npm on a version tag (v0.1.0 → 0.1.0).
# Auth: the NPM_TOKEN repo secret (an npm granular access token with
# publish rights); --provenance links the package to this build.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # tag-anchored GitHub Release
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      # A tag must publish exactly the version it names; a stale
      # package.json fails fast instead of publishing the wrong thing.
      - name: tag matches package version
        run: |
          v=$(jq -r .version package.json)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$v" >&2; exit 1; }
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - run: bun run build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Skipped until the NPM_TOKEN repo secret exists (releases are
      # published manually with an OTP meanwhile).
      - if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: github release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
